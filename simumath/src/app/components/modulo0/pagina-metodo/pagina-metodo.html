<div class="pagina-metodo" [style]="estilo()">
  <app-breadcrumb [tramos]="miga" />

  <header class="pagina-metodo__encabezado">
    <div>
      <p class="pagina-metodo__familia">{{ familia?.nombre ?? 'Módulo 0 · Errores' }}</p>
      <h1 class="pagina-metodo__nombre">{{ metodo.nombre }}</h1>
      <p class="pagina-metodo__resumen">{{ metodo.idea }}</p>
    </div>

    <nav class="pagina-metodo__pestanas" [attr.aria-label]="'Secciones de ' + metodo.nombre">
      @for (p of pestanas; track p.ruta) {
        <a
          class="pagina-metodo__pestana"
          [routerLink]="[rutaBase, p.ruta]"
          routerLinkActive="pagina-metodo__pestana--activa"
          [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page">
          <span class="material-symbols-outlined pagina-metodo__icono" aria-hidden="true">
            {{ p.icono }}
          </span>
          <span>{{ p.texto }}</span>
        </a>
      }
    </nav>
  </header>

  <div class="pagina-metodo__contenido">
    <router-outlet />
  </div>
</div>
