<app-teoria-contenido
  [teoria]="teoria"
  [formulaTex]="teoria.algoritmo.formulaTex ?? ''"
  [terceraTexto]="teoria.precision"
  terceraTitulo="¿Qué precisión y estabilidad tiene?"
  terceraIcono="straighten"
  videoEtiqueta="Video · método explicado"
  videoTitulo="Ver «Runge-Kutta de orden 4»"
  videoDescripcion="Las cuatro pendientes, la tabla con k₁…k₄ y la comparación con Euler."
>
  <section class="teoria-m3__seccion">
    <h2 class="teoria-m3__titulo">Ejemplo numérico resuelto</h2>
    <app-bloque-ejemplo-edo
      [ejemplo]="teoria.ejemploNormal"
      [estado]="estadoNormal"
      [columnas]="columnas"
      [exacta]="exactaNormal"
      [rango]="rangoNormal"
      [rangoY]="rangoYNormal"
      [dibujo]="dibujo.despues"
      leyenda="y′ = y: la poligonal de RK4 frente a eᵗ"
      tituloTabla="Tabla de pasos de RK4"
    />
  </section>

  <section class="teoria-m3__seccion">
    <h2 class="teoria-m3__titulo">Ejemplo desde una casuística real</h2>
    <app-bloque-ejemplo-edo
      [ejemplo]="teoria.ejemploCasuistica"
      [estado]="estadoCasuistica"
      [columnas]="columnas"
      [exacta]="exactaCasuistica"
      [rango]="rangoCasuistica"
      [rangoY]="rangoYCasuistica"
      [dibujo]="dibujo.despues"
      leyenda="T′ = -2T: el enfriamiento aproximado frente a e^(−2t)"
      tituloTabla="Tabla de pasos del enfriamiento"
    />
  </section>
</app-teoria-contenido>
