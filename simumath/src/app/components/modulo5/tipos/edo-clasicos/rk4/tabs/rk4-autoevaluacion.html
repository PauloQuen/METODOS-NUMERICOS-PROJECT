<div class="lista-m4-tab">
  <header class="lista-m4-tab__encabezado">
    <h2 class="lista-m4-tab__titulo">Autoevaluación</h2>
    <p class="lista-m4-tab__intro">
      Seis ejercicios para resolver a mano antes de mirar la solución. Cada uno trae tres preguntas
      de comprensión: hay que acertarlas todas y marcar el resultado como enviado para desbloquear
      la solución.
    </p>
  </header>

  @for (ejercicio of ejercicios; track ejercicio.id) {
    <section class="lista-m4-tab__bloque">
      <app-bloque-ejercicio-edo
        [ejercicio]="ejercicio"
        modulo="modulo5"
        tipo="edo-clasicos"
        metodo="rk4"
        [estado]="estadoDe($index)"
        [columnas]="columnas"
        [exacta]="exactaDe($index)"
        [rango]="rangoDe($index)"
        [rangoY]="rangoYDe($index)"
        [dibujo]="dibujoDe($index).despues"
        leyenda="la poligonal de RK4 frente a la solución exacta"
        tituloTabla="Tabla de pasos de la solución"
      />
    </section>
  }
</div>
