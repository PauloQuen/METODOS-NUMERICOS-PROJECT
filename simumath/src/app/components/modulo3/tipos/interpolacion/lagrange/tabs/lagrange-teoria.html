<app-teoria-contenido
  [teoria]="teoria"
  [terceraTexto]="teoria.precision"
  terceraTitulo="¿Qué precisión se puede esperar?"
  terceraIcono="straighten"
  videoEtiqueta="Video · ejemplo resuelto"
  videoTitulo="Ver «Interpolación de Lagrange. Ejemplo resuelto»"
  videoDescripcion="Explicación paso a paso del armado de las bases Lᵢ(x)."
>
  <!-- 7. Ejemplo numérico -->
  <section class="teoria-m3__seccion">
    <h2 class="teoria-m3__titulo">Ejemplo numérico resuelto</h2>
    <app-bloque-ejemplo-datos
      [ejemplo]="teoria.ejemploNormal"
      [filas]="estadoNormal.filas"
      [columnas]="columnas"
      [funcion]="funcionNormal"
      [rango]="rangoNormal"
      [dibujarMetodo]="dibujoNormal"
      leyenda="Polinomio interpolante P(x)"
      tituloTabla="Aporte de cada dato al polinomio"
    />
  </section>

  <!-- 8. Ejemplo de casuística -->
  <section class="teoria-m3__seccion">
    <h2 class="teoria-m3__titulo">Ejemplo desde una casuística real</h2>
    <app-bloque-ejemplo-datos
      [ejemplo]="teoria.ejemploCasuistica"
      [filas]="estadoCasuistica.filas"
      [columnas]="columnas"
      [funcion]="funcionCasuistica"
      [rango]="rangoCasuistica"
      [dibujarMetodo]="dibujoCasuistica"
      leyenda="Polinomio interpolante P(T)"
      tituloTabla="Aporte de cada dato al polinomio"
    />
  </section>
</app-teoria-contenido>
