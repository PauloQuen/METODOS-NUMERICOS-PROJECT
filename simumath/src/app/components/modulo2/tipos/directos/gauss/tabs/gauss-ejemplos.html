<div class="ejemplos">
  @for (ejemplo of ejemplos; track ejemplo.id; let i = $index) {
    <app-bloque-ejemplo
      [ejemplo]="ejemplo"
      [columnas]="columnas"
      [filas]="estados()[i].filas"
      [filaFinal]="estados()[i].filaFinal"
      [highlightBadge]="'Solución hallada'"
      [textosPasos]="estados()[i].textosPasos"
      [rango]="rangos()[i]"
      tituloPasos="Pasos (eliminación paso a paso)"
      etiquetaPaso="Paso"
      tituloCriterio="Pivoteo y eliminación"
      (pasoCambiado)="alCambiarPaso(i, $event)"
    >
      <app-grafico-sistema
        slot="grafico"
        [sistema]="estados()[i].sistema"
        [solucion]="estados()[i].solucion"
        [iteraciones]="estados()[i].filas"
        [pasoActual]="pasoDe(i)"
        [rango]="rangos()[i]"
        [dibujarSistema]="dibujar"
        leyenda="Rectas del sistema y construcción de la solución"
      />
    </app-bloque-ejemplo>
  }
</div>
