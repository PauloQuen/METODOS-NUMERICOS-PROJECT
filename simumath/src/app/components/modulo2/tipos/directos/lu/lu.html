<div class="lu" [style]="estilo()">
  <app-breadcrumb class="lu__miga" [tramos]="miga()" />

  <header class="lu__encabezado">
    <div class="lu__titulos">
      <p class="lu__familia">Métodos directos</p>
      <h1 class="lu__nombre">{{ metodo.nombre }}</h1>
      <p class="lu__resumen">{{ metodo.resumen }}</p>
    </div>

    <nav class="lu__pestanas" aria-label="Secciones de Factorización LU">
      @for (p of pestanas; track p.ruta) {
        <a
          class="lu__pestana"
          [routerLink]="['/modulo2/tipos/directos/lu', p.ruta]"
          routerLinkActive="lu__pestana--activa"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-current]="rutaActual() === p.ruta ? 'page' : null"
        >
          <span class="material-symbols-outlined lu__icono" aria-hidden="true">
            {{ p.icono }}
          </span>
          <span>{{ p.texto }}</span>
        </a>
      }
    </nav>
  </header>

  <div class="lu__contenido">
    <router-outlet />
  </div>
</div>
