<div class="ejemplos">
  @for (ejemplo of ejemplos; track ejemplo.id; let i = $index) {
    <app-bloque-ejemplo
      [ejemplo]="ejemplo"
      [sistema]="estados()[i].sistema"
      [matrices]="matricesDe(i)"
      [columnas]="columnas"
      [filas]="estados()[i].filas"
      [filaFinal]="estados()[i].filaFinal"
      [highlightBadge]="'Solución hallada'"
      [textosPasos]="estados()[i].textosPasos"
      [rango]="rangos()[i]"
      tituloPasos="Pasos (descomposición y sustituciones)"
      etiquetaPaso="Paso"
      tituloCriterio="Descomposición y sustituciones"
      (pasoCambiado)="alCambiarPaso(i, $event)"
    >
    </app-bloque-ejemplo>
  }
</div>
