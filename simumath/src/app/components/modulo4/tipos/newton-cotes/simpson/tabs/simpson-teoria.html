<app-teoria-contenido
  [teoria]="teoria"
  [formulaTex]="teoria.algoritmo.formulaTex ?? ''"
  [terceraTexto]="teoria.precision"
  terceraTitulo="¿Qué precisión se puede esperar?"
  terceraIcono="straighten"
  videoEtiqueta="Video · método explicado"
  videoTitulo="Ver «Regla de Simpson 1/3 compuesta»"
  videoDescripcion="Coeficientes 1-4-2-4-1, exigencia de n par y comparación con el trapecio."
>
  <!-- Ejemplo numérico -->
  <section class="teoria-m3__seccion">
    <h2 class="teoria-m3__titulo">Ejemplo numérico resuelto</h2>
    <app-bloque-ejemplo-integracion
      [ejemplo]="teoria.ejemploNormal"
      [estado]="estadoNormal"
      [columnas]="columnas"
      [funcion]="funcionNormal"
      [rango]="rangoNormal"
      [dibujarAntes]="dibujoNormal.antes"
      [dibujarMetodo]="dibujoNormal.despues"
      leyenda="f(x) = x² y las parábolas de Simpson"
      tituloTabla="Tabla de nodos, coeficientes y suma"
    />
  </section>

  <!-- Ejemplo de casuística -->
  <section class="teoria-m3__seccion">
    <h2 class="teoria-m3__titulo">Ejemplo desde una casuística real</h2>
    <app-bloque-ejemplo-integracion
      [ejemplo]="teoria.ejemploCasuistica"
      [estado]="estadoCasuistica"
      [columnas]="columnas"
      [funcion]="funcionCasuistica"
      [rango]="rangoCasuistica"
      [dibujarAntes]="dibujoCasuistica.antes"
      [dibujarMetodo]="dibujoCasuistica.despues"
      leyenda="sin(x) y las tres parábolas de Simpson"
      tituloTabla="Tabla de nodos, coeficientes y suma"
    />
  </section>
</app-teoria-contenido>
