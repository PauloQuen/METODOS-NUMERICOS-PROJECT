<div class="autoevaluacion">
  <header class="autoevaluacion__encabezado">
    <h2 class="autoevaluacion__titulo">Autoevaluación</h2>
    <app-cabecera-practica [total]="banco.length" (nuevaTanda)="nuevaTanda()" />
  </header>

  @for (ejercicio of ejercicios(); track ejercicio.id) {
    <section class="autoevaluacion__bloque">
      <app-bloque-ejercicio
        [ejercicio]="ejercicio"
        [mejorada]="mejorada"
        moduloId="modulo1"
        tipoId="cerrados"
        metodoId="biseccion"
        [desbloqueoBase]="desbloqueoBase"
        [funcion]="funcionDe($index)"
        [filas]="calculoDe($index).filas"
        [columnas]="columnas"
        [filaFinal]="calculoDe($index).filaFinal"
        [rango]="rangoDe($index)"
        [dibujarMetodo]="dibujar"
        [raiz]="calculoDe($index).raiz"
      />
    </section>
  }
</div>
