<div class="autoevaluacion">
  <header class="autoevaluacion__encabezado">
    <h2 class="autoevaluacion__titulo">Autoevaluación</h2>
    <p class="autoevaluacion__intro">
      Tres ejercicios para practicar Regla Falsa. Resolvé en papel, comprobá tu
      comprensión con el <strong>Cuestionario</strong> y verificá tu resultado antes de
      abrir <strong>Ver solución</strong>.
    </p>
  </header>

  @for (ejercicio of ejercicios; track ejercicio.id; let i = $index) {      <app-bloque-ejercicio
        [ejercicio]="ejercicio"
        [mejorada]="mejorada"
        moduloId="modulo1"
        tipoId="cerrados"
        metodoId="regla-falsa"
        [desbloqueoBase]="desbloqueoBase"
      [columnas]="columnas"
      [filas]="estados()[i].filas"
      [filaFinal]="estados()[i].filaFinal"
      [funcion]="funciones[i]"
      [rango]="rangos()[i]"
      [dibujarMetodo]="dibujar"
      [raiz]="estados()[i].raiz"
    />
  }
</div>
