<div class="ejemplos">
  <header><h2>Ejemplos resueltos</h2><p>Explora cada ejemplo paso a paso: la gráfica, los indicadores y el historial avanzan juntos.</p></header>
  @for (ejemplo of ejemplos; track ejemplo.id; let i = $index) {
    <app-regla-falsa-ejemplo
      [ejemplo]="ejemplo"
      [funcion]="funciones[i]"
      [rango]="rangos[i]"
    />
  }
</div>
