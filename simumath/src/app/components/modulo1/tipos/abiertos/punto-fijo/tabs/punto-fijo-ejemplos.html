<div class="ejemplos">
  <header><h2>Ejemplos resueltos</h2><p>Descubre cómo se obtiene g(x) y recorre cada ejemplo: la telaraña, el detalle de la iteración y el historial avanzan juntos.</p></header>
  @for (ejemplo of ejemplos; track ejemplo.id; let i = $index) {
    <app-punto-fijo-ejemplo
      [ejemplo]="ejemplo"
      [g]="funciones[i]"
    />
  }
</div>
