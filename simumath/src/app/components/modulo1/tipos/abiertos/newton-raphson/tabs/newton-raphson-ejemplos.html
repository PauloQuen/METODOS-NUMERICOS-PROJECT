<div class="ejemplos">
  <header>
    <h2>Ejemplos resueltos</h2>
    <p>Explora cada ejemplo paso a paso: las tangentes, el detalle de la iteración y el historial avanzan juntos.</p>
  </header>
  @for (ejemplo of ejemplos; track ejemplo.id; let i = $index) {
    <app-newton-raphson-ejemplo
      [ejemplo]="ejemplo"
      [funcion]="funciones[i]"
    />
  }
</div>
