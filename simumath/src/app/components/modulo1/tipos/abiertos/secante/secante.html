<div class="secante" [style]="estilo()">
  <app-breadcrumb class="secante__miga" [tramos]="miga()" />

  <header class="secante__encabezado">
    <div class="secante__titulos">
      <p class="secante__familia">Métodos abiertos</p>
      <h1 class="secante__nombre">{{ metodo.nombre }}</h1>
      <p class="secante__resumen">{{ metodo.resumen }}</p>
    </div>

    <nav class="secante__pestanas" aria-label="Secciones de Secante">
      @for (p of pestanas; track p.ruta) {
        <a
          class="secante__pestana"
          [routerLink]="['/modulo1/tipos/abiertos/secante', p.ruta]"
          routerLinkActive="secante__pestana--activa"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-current]="rutaActual() === p.ruta ? 'page' : null"
        >
          <span class="material-symbols-outlined secante__icono" aria-hidden="true">
            {{ p.icono }}
          </span>
          <span>{{ p.texto }}</span>
        </a>
      }
    </nav>
  </header>

  <div class="secante__contenido">
    <router-outlet />
  </div>
</div>
