<section class="auto-mejorada">
  <div class="section-heading">
    <h2 class="section-heading__title">Autoevaluación del módulo 1</h2>
    <p class="section-heading__subtitle">Practica un ejercicio aleatorio de cada método, con cuatro preguntas por ejercicio y resolución visual guiada. El banco completo tiene 24 ejercicios por método.</p>
    <button type="button" (click)="nuevaTanda()">Generar otra tanda</button>
  </div>
  <div class="auto-mejorada__list">
    @for(g of ejercicios();track g.metodo) {
      <section><h3>{{g.nombre}}</h3>
        <app-bloque-ejercicio [ejercicio]="g.ejercicio" [mejorada]="true" moduloId="modulo1" [tipoId]="g.tipo" [metodoId]="g.metodo" [desbloqueoBase]="g.desbloqueo" />
      </section>
    }
  </div>
</section>
