<div class="field">
  <label class="field__label" [for]="id()">{{ label() }}</label>
  @if (multilinea()) {
    <textarea
      class="field__input field__input--multilinea"
      [id]="id()"
      [rows]="filas()"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
    ></textarea>
  } @else {
    <input
      class="field__input"
      [id]="id()"
      [type]="type()"
      [step]="type() === 'number' ? 'any' : null"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
      (keydown.enter)="enter.emit()"
    />
  }
  @if (hint()) {
    <span class="field__hint">{{ hint() }}</span>
  }
</div>
