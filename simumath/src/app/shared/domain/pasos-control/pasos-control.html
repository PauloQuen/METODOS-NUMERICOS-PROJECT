<div class="pasos">
  <div class="pasos__cabecera">
    <span class="pasos__contador">{{ etiqueta() }}</span>
  </div>

  <div class="pasos__botones" role="group" [attr.aria-label]="ariaGrupo()">
    <button
      type="button"
      class="paso-btn"
      (click)="irAlInicio()"
      [disabled]="!hayPasos() || enInicio()"
      [attr.aria-label]="ariaInicio()"
      [title]="ariaInicio()"
    >
      <span aria-hidden="true">⏮</span>
    </button>

    <button
      type="button"
      class="paso-btn"
      (click)="irAlAnterior()"
      [disabled]="!hayPasos() || enInicio()"
      [attr.aria-label]="ariaAnterior()"
      [title]="ariaAnterior()"
    >
      <span aria-hidden="true">◀</span>
    </button>

    <button
      type="button"
      class="paso-btn paso-btn--siguiente"
      (click)="irAlSiguiente()"
      [disabled]="!hayPasos() || enFinal()"
      [attr.aria-label]="ariaSiguiente()"
      [title]="ariaSiguiente()"
    >
      <span aria-hidden="true">▶</span>
    </button>

    <button
      type="button"
      class="paso-btn"
      (click)="irAlFinal()"
      [disabled]="!hayPasos() || enFinal()"
      [attr.aria-label]="ariaFinal()"
      [title]="ariaFinal()"
    >
      <span aria-hidden="true">⏭</span>
    </button>

    <button
      type="button"
      class="paso-btn paso-btn--reproducir"
      (click)="alternarReproduccion()"
      [disabled]="!hayPasos()"
      [attr.aria-pressed]="reproduciendo()"
    >
      <span aria-hidden="true">{{ reproduciendo() ? '⏸' : '▶' }}</span>
      {{ reproduciendo() ? 'Pausar' : 'Reproducir' }}
    </button>
  </div>

  @if (texto()) {
    @if(formatoMatricial()) { <app-texto-matricial [texto]="texto()" /> } @else { <p class="pasos__texto">{{ texto() }}</p> }
  }
</div>
