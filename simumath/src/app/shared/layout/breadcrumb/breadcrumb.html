<nav class="breadcrumb" [class]="tonoClass()" [attr.aria-label]="'Ruta de navegación'">
  @for (tramo of tramos(); track $index) {
    @if ($index > 0) {
      <span class="breadcrumb__sep" aria-hidden="true">›</span>
    }

    @if (tramo.ruta) {
      <a class="breadcrumb__link" [routerLink]="tramo.ruta">{{ tramo.texto }}</a>
    } @else {
      <strong class="breadcrumb__actual" aria-current="page">{{ tramo.texto }}</strong>
    }
  }
</nav>
